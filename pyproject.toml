[project]
name = "lab04-workbench"
version = "0.1.0"
description = "Lab 04: Unity Developer Workbench for JarLight (MAS + Obsidian/Chroma KB)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.12.0,<3.0.0",
    "chromadb>=1.5.0",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.60.0",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "playwright>=1.50.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
